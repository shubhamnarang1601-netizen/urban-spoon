<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier — Jewelry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body data-page="atelier">
<main>
  <section class="atelier">
    <div class="viewer">
      <canvas id="view"></canvas>
      <button class="btn snap" id="snap">Snapshot</button>
      <div class="hint">Drag to rotate · Scroll to zoom</div>
    </div>
    <aside class="panel-ui">
      <p class="eyebrow">Live 3D configurator</p>
      <h2>Design your <em class="gold-text">piece</em></h2>
      <p class="lead">Every change is rendered instantly. Price updates as you go.</p>
      <div class="opt"><label>Piece <b id="l-piece">Ring</b></label><div class="pieces" id="pieces"></div></div>
      <div class="opt"><label>Metal <b id="l-metal"></b></label><div class="swatches" id="metals"></div></div>
      <div class="opt"><label>Gemstone <b id="l-gem"></b></label><div class="swatches" id="gems"></div></div>
      <div class="opt"><label>Carat <b id="l-size"></b></label><input type="range" id="size" min="0.6" max="1.5" step="0.05" value="1"></div>
      <div class="opt"><label>Environment sparkle</label><input type="range" id="bloom" min="0" max="1.5" step="0.05" value="0.3"></div>
      <div class="total"><span class="eyebrow">Estimated</span><b id="price">$0</b></div>
      <button class="btn solid" id="add">Add to bag</button>
      <a class="btn" href="contact.html">Book a private viewing</a>
    </aside>
  </section>
</main>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script src="vendor/lenis.min.js"></script>
<script type="module" src="js/atelier.js"></script>
</body>
</html>
